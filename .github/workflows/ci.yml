name: Video factory checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Portable script smoke test
        run: npm run check:portable
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Report environment
        run: npm run doctor -- --json
